services:
  aip-monitor:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:4173:4173"
    volumes:
      - aip-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  aip-data:
